name: ADR files check

# Two ADRs merged in parallel can take the same number, and a file name or title can drift from
# the template. This check runs .github/scripts/check-adr-files.py on every change to adr/.

on:
  push:
    paths:
      - 'adr/**'
      - '.github/scripts/check-adr-files.py'
      - '.github/workflows/ci-test-adr.yml'
  pull_request:
    paths:
      - 'adr/**'
      - '.github/scripts/check-adr-files.py'
      - '.github/workflows/ci-test-adr.yml'

permissions:
  contents: read

jobs:
  adr-check:
    name: Check ADR file names and numbers
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Check ADR file names, titles and unique numbers
        run: python3 .github/scripts/check-adr-files.py
